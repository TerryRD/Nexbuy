<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f77062"/>
      <stop offset="100%" stop-color="#fe5196"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Sparkle shapes -->
  <g fill="rgba(255,255,255,0.12)">
    <!-- Star 1 -->
    <polygon points="200,60 208,80 230,80 212,94 220,116 200,100 180,116 188,94 170,80 192,80"/>
    <!-- Star 2 -->
    <polygon points="950,50 956,66 974,66 960,76 966,92 950,82 934,92 940,76 926,66 944,66"/>
    <!-- Star 3 -->
    <polygon points="1100,300 1106,316 1124,316 1110,326 1116,342 1100,332 1084,342 1090,326 1076,316 1094,316"/>
    <!-- Star 4 -->
    <polygon points="150,320 155,332 168,332 158,340 162,352 150,344 138,352 142,340 132,332 145,332"/>
  </g>
  <!-- More sparkle dots -->
  <g fill="rgba(255,255,255,0.15)">
    <circle cx="300" cy="100" r="4"/>
    <circle cx="800" cy="80" r="3"/>
    <circle cx="1050" cy="200" r="5"/>
    <circle cx="100" cy="200" r="3"/>
    <circle cx="700" cy="340" r="4"/>
    <circle cx="400" cy="350" r="3"/>
    <circle cx="1000" cy="120" r="3"/>
  </g>
  <!-- Diagonal stripes -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="40">
    <line x1="600" y1="-50" x2="1300" y2="450"/>
    <line x1="700" y1="-50" x2="1400" y2="450"/>
    <line x1="800" y1="-50" x2="1500" y2="450"/>
  </g>
  <!-- SALE text -->
  <text x="600" y="180" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="12">SALE</text>
  <!-- Subtitle -->
  <text x="600" y="250" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="300" fill="rgba(255,255,255,0.9)">Up to 50% OFF</text>
  <!-- Divider line -->
  <rect x="530" y="270" width="140" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
  <!-- Additional text -->
  <text x="600" y="310" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">Limited Time Offer</text>
  <!-- CTA -->
  <rect x="510" y="330" width="180" height="44" rx="22" fill="#ffffff" opacity="0.2" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
  <text x="600" y="358" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Shop Deals</text>
</svg>