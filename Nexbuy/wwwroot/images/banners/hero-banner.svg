<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="shape1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Abstract geometric shapes -->
  <circle cx="950" cy="80" r="120" fill="rgba(255,255,255,0.06)"/>
  <circle cx="1000" cy="300" r="80" fill="rgba(255,255,255,0.04)"/>
  <circle cx="850" cy="200" r="160" fill="rgba(255,255,255,0.03)"/>
  <!-- Triangles -->
  <polygon points="1050,50 1150,180 950,180" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <polygon points="900,280 980,380 820,380" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Floating squares -->
  <rect x="780" y="60" width="60" height="60" rx="8" fill="url(#shape1)" transform="rotate(15 810 90)"/>
  <rect x="1080" y="240" width="45" height="45" rx="6" fill="url(#shape1)" transform="rotate(-20 1102 262)"/>
  <rect x="700" y="300" width="35" height="35" rx="4" fill="url(#shape1)" transform="rotate(30 717 317)"/>
  <!-- Dots pattern -->
  <g fill="rgba(255,255,255,0.1)">
    <circle cx="750" cy="150" r="3"/>
    <circle cx="780" cy="170" r="3"/>
    <circle cx="810" cy="150" r="3"/>
    <circle cx="750" cy="190" r="3"/>
    <circle cx="780" cy="210" r="3"/>
    <circle cx="810" cy="190" r="3"/>
  </g>
  <!-- Logo text -->
  <text x="100" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Nexbuy</text>
  <!-- Tagline -->
  <text x="105" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="300" fill="rgba(255,255,255,0.85)">Shop the Latest</text>
  <!-- Subtle divider -->
  <rect x="105" y="230" width="60" height="3" rx="1.5" fill="rgba(255,255,255,0.5)"/>
  <!-- Sub-tagline -->
  <text x="105" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)">Discover trending products, unbeatable prices</text>
  <!-- CTA button shape -->
  <rect x="105" y="295" width="180" height="48" rx="24" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <text x="195" y="325" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Shop Now</text>
</svg>