<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a80"/>
      <stop offset="100%" stop-color="#293241"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="denim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6e9e"/>
      <stop offset="100%" stop-color="#3a5578"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="12"/>
  <!-- Jeans shape -->
  <g filter="url(#shadow)">
    <!-- Waistband -->
    <path d="M280,140 L520,140 L525,170 L275,170 Z" fill="#3a5578" stroke="#2a3f5a" stroke-width="1.5"/>
    <!-- Belt loops -->
    <rect x="310" y="135" width="12" height="40" rx="2" fill="#3a5578" stroke="#2a3f5a" stroke-width="1"/>
    <rect x="395" y="135" width="12" height="40" rx="2" fill="#3a5578" stroke="#2a3f5a" stroke-width="1"/>
    <rect x="478" y="135" width="12" height="40" rx="2" fill="#3a5578" stroke="#2a3f5a" stroke-width="1"/>
    <!-- Main body -->
    <path d="
      M275,170
      L270,380 L260,620 L360,620 L380,380
      L400,320
      L420,380 L440,620 L540,620 L530,380
      L525,170 Z
    " fill="url(#denim)" stroke="#2a3f5a" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Front fly seam -->
    <path d="M400,170 L400,320" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Pocket outlines -->
    <path d="M290,180 L290,250 Q320,260 350,245 L340,180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <path d="M510,180 L510,250 Q480,260 450,245 L460,180" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <!-- Knee creases -->
    <path d="M290,420 Q310,430 330,420" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <path d="M470,420 Q490,430 510,420" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Button -->
    <circle cx="400" cy="155" r="6" fill="#2a3f5a" stroke="#1a2f4a" stroke-width="1"/>
  </g>
  <!-- Product name -->
  <text x="400" y="700" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Slim Straight Jeans</text>
  <text x="400" y="735" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Classic Denim</text>
</svg>