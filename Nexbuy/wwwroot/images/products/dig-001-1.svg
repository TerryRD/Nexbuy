<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3557"/>
      <stop offset="100%" stop-color="#457b9d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="book" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a5a7a"/>
      <stop offset="100%" stop-color="#1a4060"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="12"/>
  <!-- Decorative code lines in background -->
  <g opacity="0.08" fill="#fff">
    <text x="80" y="100" font-family="monospace" font-size="14">def learn_python():</text>
    <text x="100" y="120" font-family="monospace" font-size="14">for topic in course:</text>
    <text x="120" y="140" font-family="monospace" font-size="14">master(topic)</text>
    <text x="500" y="700" font-family="monospace" font-size="14">import knowledge</text>
    <text x="520" y="720" font-family="monospace" font-size="14">skills.upgrade()</text>
    <text x="60" y="720" font-family="monospace" font-size="14">while True: keep_coding()</text>
  </g>
  <!-- Book shape -->
  <g filter="url(#shadow)">
    <rect x="250" y="200" width="300" height="360" rx="6" fill="url(#book)" stroke="#1a4060" stroke-width="2"/>
    <!-- Book spine -->
    <rect x="250" y="200" width="20" height="360" fill="#1a3050"/>
    <!-- Book pages edge -->
    <rect x="268" y="208" width="4" height="344" fill="rgba(255,255,255,0.1)"/>
  </g>
  <!-- Code bracket icon on book cover -->
  <g transform="translate(400,340)">
    <!-- Left bracket -->
    <text x="-70" y="15" font-family="monospace" font-size="80" font-weight="bold" fill="rgba(255,255,255,0.7)">&lt;/&gt;</text>
  </g>
  <!-- Play button circle -->
  <circle cx="400" cy="440" r="30" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <polygon points="392,425 392,455 418,440" fill="rgba(255,255,255,0.5)"/>
  <!-- Python logo hint (two interlinked shapes) -->
  <g transform="translate(400,260)" opacity="0.3">
    <circle cx="-15" cy="0" r="10" fill="#3776ab"/>
    <circle cx="15" cy="0" r="10" fill="#ffd43b"/>
  </g>
  <!-- Product name -->
  <text x="400" y="650" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff">Python Programming Course</text>
  <text x="400" y="685" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Digital Download</text>
</svg>