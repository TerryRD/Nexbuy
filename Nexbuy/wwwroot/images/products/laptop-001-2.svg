<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4d4d4"/>
      <stop offset="100%" stop-color="#ececec"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8c8c8"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="12"/>
  <!-- Closed laptop - side/profile view -->
  <g filter="url(#shadow)">
    <!-- Bottom half (base) -->
    <path d="M180,420 L620,420 L630,440 L170,440 Z" fill="url(#body)" stroke="#999" stroke-width="1"/>
    <!-- Top half (lid) -->
    <path d="M178,418 L622,418 L624,404 L176,404 Z" fill="#b8b8b8" stroke="#999" stroke-width="1"/>
    <!-- Thin line between lid and base -->
    <line x1="175" y1="419" x2="625" y2="419" stroke="#888" stroke-width="0.5"/>
    <!-- Edge highlight -->
    <line x1="180" y1="405" x2="620" y2="405" stroke="rgba(255,255,255,0.5)" stroke-width="0.5"/>
  </g>
  <!-- Subtle front edge detail -->
  <rect x="350" y="430" width="100" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>
  <!-- Perspective shadow below -->
  <ellipse cx="400" cy="460" rx="240" ry="8" fill="rgba(0,0,0,0.08)"/>
  <!-- Thin indicator light -->
  <circle cx="400" cy="436" r="2" fill="#7ec87e" opacity="0.7"/>
  <!-- Product name -->
  <text x="400" y="560" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#333333">Ultra-thin Laptop 14"</text>
  <text x="400" y="595" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(0,0,0,0.4)">Closed View</text>
  <!-- Dimension hint -->
  <line x1="170" y1="480" x2="630" y2="480" stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="400" y="498" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="rgba(0,0,0,0.25)">14" Ultra-thin Design</text>
</svg>