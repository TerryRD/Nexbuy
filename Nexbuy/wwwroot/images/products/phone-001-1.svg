<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#2d4a7a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="12"/>
  <!-- Phone body -->
  <rect x="290" y="120" width="220" height="440" rx="24" fill="#0f0f1a" filter="url(#shadow)" stroke="#3a3a5c" stroke-width="2"/>
  <!-- Screen -->
  <rect x="304" y="158" width="192" height="364" rx="4" fill="url(#screen)"/>
  <!-- Front camera notch -->
  <rect x="365" y="132" width="70" height="8" rx="4" fill="#222240"/>
  <!-- Camera dot -->
  <circle cx="420" cy="136" r="3" fill="#555580"/>
  <!-- Home bar -->
  <rect x="370" y="538" width="60" height="4" rx="2" fill="#3a3a5c"/>
  <!-- Screen reflection line -->
  <line x1="310" y1="180" x2="380" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="40" stroke-linecap="round"/>
  <!-- App grid dots -->
  <circle cx="340" cy="220" r="10" fill="rgba(255,255,255,0.15)"/>
  <circle cx="380" cy="220" r="10" fill="rgba(255,255,255,0.15)"/>
  <circle cx="420" cy="220" r="10" fill="rgba(255,255,255,0.15)"/>
  <circle cx="460" cy="220" r="10" fill="rgba(255,255,255,0.15)"/>
  <circle cx="340" cy="260" r="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="380" cy="260" r="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="420" cy="260" r="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="460" cy="260" r="10" fill="rgba(255,255,255,0.1)"/>
  <!-- Product name -->
  <text x="400" y="660" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff">Flagship Smartphone Pro</text>
  <text x="400" y="695" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">Front View</text>
</svg>