<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c0c0c0"/>
      <stop offset="100%" stop-color="#e8e8e8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#2a5a9a"/>
    </linearGradient>
    <linearGradient id="lid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#a0a0a0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" rx="12"/>
  <!-- Screen lid -->
  <g filter="url(#shadow)">
    <path d="M200,160 L600,160 L620,440 L180,440 Z" fill="url(#lid)" stroke="#999" stroke-width="1.5"/>
    <!-- Screen -->
    <path d="M220,175 L580,175 L598,430 L198,430 Z" fill="url(#screen)"/>
    <!-- Screen reflection -->
    <path d="M220,175 L360,175 L340,430 L198,430 Z" fill="rgba(255,255,255,0.06)"/>
    <!-- Camera dot -->
    <circle cx="400" cy="168" r="2.5" fill="#666"/>
  </g>
  <!-- Keyboard base -->
  <g filter="url(#shadow)">
    <path d="M160,445 L640,445 L680,560 L120,560 Z" fill="url(#base)" stroke="#999" stroke-width="1"/>
    <!-- Keyboard rows -->
    <g fill="#888" opacity="0.5">
      <rect x="200" y="460" width="400" height="6" rx="1"/>
      <rect x="210" y="474" width="380" height="6" rx="1"/>
      <rect x="220" y="488" width="360" height="6" rx="1"/>
      <rect x="230" y="502" width="340" height="6" rx="1"/>
    </g>
    <!-- Trackpad -->
    <rect x="340" y="520" width="120" height="30" rx="4" fill="rgba(0,0,0,0.08)" stroke="#aaa" stroke-width="0.5"/>
  </g>
  <!-- Product name -->
  <text x="400" y="660" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#333333">Ultra-thin Laptop 14"</text>
  <text x="400" y="695" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="rgba(0,0,0,0.4)">Open View</text>
</svg>