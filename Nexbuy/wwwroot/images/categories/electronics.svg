<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#004060" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- Circuit board pattern -->
  <g stroke="rgba(255,255,255,0.12)" stroke-width="1.5" fill="none">
    <line x1="50" y1="80" x2="150" y2="80"/>
    <line x1="150" y1="80" x2="150" y2="120"/>
    <line x1="250" y1="60" x2="350" y2="60"/>
    <line x1="300" y1="60" x2="300" y2="100"/>
    <line x1="60" y1="200" x2="120" y2="200"/>
    <line x1="120" y1="200" x2="120" y2="240"/>
    <line x1="280" y1="220" x2="350" y2="220"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="rgba(255,255,255,0.2)">
    <circle cx="150" cy="80" r="4"/>
    <circle cx="300" cy="60" r="4"/>
    <circle cx="120" cy="200" r="4"/>
    <circle cx="350" cy="220" r="3"/>
    <circle cx="50" cy="80" r="3"/>
  </g>
  <!-- Chip icon -->
  <g filter="url(#shadow)" transform="translate(200,130)">
    <rect x="-40" y="-40" width="80" height="80" rx="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Chip pins -->
    <g stroke="rgba(255,255,255,0.3)" stroke-width="2">
      <line x1="-25" y1="-45" x2="-25" y2="-55"/>
      <line x1="-10" y1="-45" x2="-10" y2="-55"/>
      <line x1="10" y1="-45" x2="10" y2="-55"/>
      <line x1="25" y1="-45" x2="25" y2="-55"/>
      <line x1="-25" y1="45" x2="-25" y2="55"/>
      <line x1="-10" y1="45" x2="-10" y2="55"/>
      <line x1="10" y1="45" x2="10" y2="55"/>
      <line x1="25" y1="45" x2="25" y2="55"/>
      <line x1="-45" y1="-25" x2="-55" y2="-25"/>
      <line x1="-45" y1="-10" x2="-55" y2="-10"/>
      <line x1="-45" y1="10" x2="-55" y2="10"/>
      <line x1="-45" y1="25" x2="-55" y2="25"/>
      <line x1="45" y1="-25" x2="55" y2="-25"/>
      <line x1="45" y1="-10" x2="55" y2="-10"/>
      <line x1="45" y1="10" x2="55" y2="10"/>
      <line x1="45" y1="25" x2="55" y2="25"/>
    </g>
    <!-- Inner die -->
    <rect x="-18" y="-18" width="36" height="36" rx="2" fill="rgba(255,255,255,0.1)"/>
  </g>
  <!-- Category name -->
  <text x="200" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Electronics</text>
</svg>